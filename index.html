<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyPainter</title>
  </head>
  <body>
    <div id="viewport"></div>

    <header class="toolbar">
      <h1>PolyPainter</h1>
      <nav id="solid-picker" class="picker" aria-label="Choose a Platonic solid"></nav>
    </header>

    <footer class="status">
      <span id="solid-stats"></span>
      <span class="hint">Drag to rotate · Scroll or pinch to zoom</span>
      <button id="reset-view" type="button">Reset view</button>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
