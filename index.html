<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PolyPainter</title>
  </head>
  <body>
    <div id="viewport"></div>

    <header class="toolbar">
      <h1>PolyPainter</h1>
      <nav id="solid-picker" class="picker" aria-label="Choose a Platonic solid"></nav>
    </header>

    <aside class="tools" aria-label="Painting tools">
      <div class="field symmetry">
        <label for="symmetry">Symmetry</label>
        <select id="symmetry"></select>
        <p id="symmetry-note" class="note"></p>
      </div>

      <div class="field">
        <span class="label">Tool</span>
        <div id="tool-picker" class="segmented">
          <button type="button" data-tool="paint">Paint</button>
          <button type="button" data-tool="fill">Fill</button>
          <button type="button" data-tool="erase">Erase</button>
          <button type="button" data-tool="rotate">Rotate</button>
        </div>
      </div>

      <div class="field">
        <span class="label">Color</span>
        <div id="swatches" class="swatches">
          <button id="transparent-color" class="swatch" type="button" title="Transparent" aria-label="Transparent"></button>
          <input id="custom-color" class="swatch" type="color" value="#ffffff" aria-label="Custom color" />
        </div>
      </div>

      <div class="field">
        <label for="brush-size">Brush size</label>
        <input id="brush-size" type="range" min="1" max="40" value="8" />
      </div>

      <div class="actions">
        <button id="undo" type="button">Undo</button>
        <button id="redo" type="button">Redo</button>
        <button id="clear" type="button">Clear</button>
      </div>

      <label class="checkbox"><input id="show-edges" type="checkbox" checked /> Show edges</label>

      <button id="export-net" type="button" title="Download the solid unfolded on an A4 page to print, with a DXF of the lines to cut">
        Export net
      </button>
    </aside>

    <footer class="status">
      <span id="solid-stats"></span>
      <span id="hint" class="hint"></span>
      <button id="reset-view" type="button">Reset view</button>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
